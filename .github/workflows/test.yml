name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        run: bash tests/static-check.sh
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
